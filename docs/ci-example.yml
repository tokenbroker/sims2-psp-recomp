name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  framework:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python tools/check_public_tree.py
      - run: cmake -S . -B out/core
      - run: cmake --build out/core --config Release --parallel 2
      - run: ctest --test-dir out/core -C Release --output-on-failure
