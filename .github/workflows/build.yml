name: Source and host regressions
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    name: Windows ${{ matrix.region }} ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        backend: [D3D11, VULKAN]
        region: [USA, EUROPE]
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python tools/check_public_tree.py
      - run: python profiles/sims2/tools/fetch_dependencies.py
      - if: matrix.backend == 'VULKAN'
        run: python profiles/sims2/tools/fetch_dependencies.py --shader-tools
      - run: cmake -S . -B out/ci -G "Visual Studio 17 2022" -A x64 -DPSPRECOMP_PROFILE=sims2 -DSIMS2_HOST_TESTS_ONLY=ON -DSIMS2_GRAPHICS_BACKEND=${{ matrix.backend }} -DSIMS2_REGION=${{ matrix.region }}
      - run: cmake --build out/ci --config Release --parallel 2
      - if: matrix.backend == 'D3D11'
        run: ctest --test-dir out/ci -C Release --output-on-failure
      # Hosted Windows runners do not guarantee a Vulkan-capable driver.
      # Compile the complete backend; run its GPU-independent regressions here.
      - if: matrix.backend == 'VULKAN'
        run: ctest --test-dir out/ci -C Release --output-on-failure -LE gpu
  linux:
    name: Linux ${{ matrix.region }}
    strategy:
      fail-fast: false
      matrix:
        region: [USA, EUROPE]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tools/check_public_tree.py
      - run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config glslang-tools libvulkan-dev mesa-vulkan-drivers libavcodec-dev libavutil-dev libfreetype-dev libfontconfig1-dev fonts-liberation libwayland-dev libxkbcommon-dev libdecor-0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev libegl1-mesa-dev libudev-dev xvfb weston
      - run: cmake -S . -B out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPSPRECOMP_PROFILE=sims2 -DSIMS2_HOST_TESTS_ONLY=ON -DSIMS2_REGION=${{ matrix.region }}
      - run: cmake --build out/ci --parallel 2
      - run: SDL_VIDEO_DRIVER=x11 SDL_AUDIO_DRIVER=dummy SIMS2_SETTINGS_PATH="$PWD/out/ci/test-settings.ini" xvfb-run -a -s '-screen 0 1920x1080x24' ctest --test-dir out/ci --output-on-failure
      - name: Wayland Vulkan shell
        run: python3 profiles/sims2/tests/run_wayland_tests.py out/ci
  linux-distros:
    name: Linux ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Fedora 44
            image: registry.fedoraproject.org/fedora:44
            packages: fedora
          - distro: Arch rolling
            image: archlinux:base-devel
            packages: arch
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fedora dependencies
        if: matrix.packages == 'fedora'
        run: dnf install -y git gcc-c++ cmake ninja-build python3 pkgconf-pkg-config glslang vulkan-loader-devel mesa-vulkan-drivers SDL3-devel libavcodec-free-devel libavutil-free-devel freetype-devel fontconfig-devel liberation-sans-fonts xorg-x11-server-Xvfb xorg-x11-xauth weston
      - name: Fedora full movie decoder
        if: matrix.packages == 'fedora'
        run: |
          dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
          dnf install -y libavcodec-freeworld
      - name: Arch dependencies
        if: matrix.packages == 'arch'
        run: pacman -Syu --noconfirm --needed git base-devel cmake ninja python pkgconf glslang vulkan-icd-loader vulkan-swrast sdl3 ffmpeg freetype2 fontconfig ttf-liberation libdecor libxkbcommon wayland xorg-server-xvfb xorg-xauth weston
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Trust this container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 tools/check_public_tree.py
      - name: Check build tools and required decoders
        run: python3 profiles/sims2/tools/doctor.py
      - run: cmake -S . -B out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPSPRECOMP_PROFILE=sims2 -DSIMS2_HOST_TESTS_ONLY=ON
      - run: cmake --build out/ci --parallel 2
      - name: X11 Vulkan host regressions
        run: SDL_VIDEO_DRIVER=x11 SDL_AUDIO_DRIVER=dummy SIMS2_SETTINGS_PATH="$PWD/out/ci/test-settings.ini" xvfb-run -a -s '-screen 0 1920x1080x24' ctest --test-dir out/ci --output-on-failure
      - name: Wayland Vulkan shell
        run: python3 profiles/sims2/tests/run_wayland_tests.py out/ci
